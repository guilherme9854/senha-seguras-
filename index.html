<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Pro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">

        <header class="app-header">
            <div class="icone-wrapper">
                <img src="unlock.svg" alt="Cadeado de Segurança" class="app-logo">
            </div>
            <h1 class="titulo-principal">Gerador de Senhas</h1>
            <p class="titulo-secundario">Crie combinações de alta segurança instantaneamente</p>
        </header>

        <section class="card-senha">
            <span class="label-badge">Sua Senha Segura</span>
            <div class="senha-box">
                <input type="text" id="campo-senha" readonly value="#pEF9F+y#a!v1">
                <button id="copiar" title="Copiar senha">
                    <span class="icone-copiar">📋</span>
                    <span class="texto-copiar">Copiar</span>
                </button>
            </div>
        </section>

        <section class="card-config">
            <h2 class="config-titulo">Personalizar Configurações</h2>

            <div class="grid-config">
                
                <div class="grupo-controle controle-comprimento">
                    <div class="header-controle">
                        <label for="range-caracteres">Número de caracteres</label>
                        <span class="parametro-senha__texto" id="valor-tamanho">12</span>
                    </div>

                    <div class="slider-wrapper">
                        <button class="parametro-senha__botao" id="btn-menos">−</button>
                        <input type="range" id="range-caracteres" min="4" max="32" value="12" class="range-slider">
                        <button class="parametro-senha__botao" id="btn-mais">+</button>
                    </div>
                </div>

                <div class="grupo-controle">
                    <label class="label-grupo">Incluir no Gerador</label>
                    <div class="grid-opcoes">

                        <label class="toggle-option">
                            <input type="checkbox" id="maiusculo" checked>
                            <span class="toggle-switch"></span>
                            <span class="toggle-label">Letras maiúsculas (A-Z)</span>
                        </label>

                        <label class="toggle-option">
                            <input type="checkbox" id="minusculo" checked>
                            <span class="toggle-switch"></span>
                            <span class="toggle-label">Letras minúsculas (a-z)</span>
                        </label>

                        <label class="toggle-option">
                            <input type="checkbox" id="numero" checked>
                            <span class="toggle-switch"></span>
                            <span class="toggle-label">Números (0-9)</span>
                        </label>

                        <label class="toggle-option">
                            <input type="checkbox" id="simbolo" checked>
                            <span class="toggle-switch"></span>
                            <span class="toggle-label">Símbolos (!@#$)</span>
                        </label>

                    </div>
                </div>

            </div>

            <button id="btn-gerar" class="btn-principal">
                <span>🔄 Gerar Nova Senha</span>
            </button>

            <div class="card-forca">
                <div class="header-forca">
                    <span>Força da Senha</span>
                    <span id="badge-nivel" class="badge-status">Forte</span>
                </div>

                <div class="barra-forca">
                    <div id="nivel-forca"></div>
                </div>

                <div class="legenda-forca">
                    <span>Fraca</span>
                    <span>Média</span>
                    <span>Forte</span>
                </div>

                <p id="tempo-forca">
                    Um computador levaria milhões de anos para descobrir esta senha.
                </p>
            </div>

        </section>

    </main>

    <script src="main.js"></script>
</body>

</html>
